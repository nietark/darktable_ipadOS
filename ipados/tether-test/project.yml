# Fallback for when TetherTest.xcodeproj does not open in your Xcode:
#   brew install xcodegen && xcodegen generate
# This regenerates TetherTest.xcodeproj from the settings below.
name: TetherTest
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  TetherTest:
    type: application
    platform: iOS
    sources:
      - path: TetherTest/Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TetherTest/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TetherTest
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: "org.darktable.ipados.tethertest.$(DEVELOPMENT_TEAM)"
        SWIFT_OBJC_BRIDGING_HEADER: TetherTest/Sources/TetherTest-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
